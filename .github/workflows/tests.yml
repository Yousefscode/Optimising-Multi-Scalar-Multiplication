name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python -m msm.benchmark --quick --no-plots --out /tmp/bench
      - name: Execute the results notebook
        run: |
          pip install nbconvert ipykernel
          jupyter nbconvert --to notebook --execute notebooks/msm_results.ipynb --output /tmp/msm_results_executed.ipynb
